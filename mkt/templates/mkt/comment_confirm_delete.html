{% extends "base_menu.html" %}
{% block content %}
<h1>Delete Comment</h1>
<p>Are you sure you want to delete: </p>
<p>{{comment.text}}?</p>
<form method="POST">
    {% csrf_token %}
    <input type="submit" class="btn btn-primary" value="Yes, delete.">
    <input type="submit" class="btn btn-secondary" value="Cancel" onclick="window.location='{% url 'mkt:ad_detail' comment.ad.id %}'; return false;">
</form>
{% endblock %}
