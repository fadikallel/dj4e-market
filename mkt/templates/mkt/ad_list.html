{% extends "base_menu.html" %}

{% block content %}
<h1>Market 5.0</h1>
<div style="float:right">
    <form>
        <input type="text" placeholder="Search..." name="search" {% if search %} value="{{ search}}" {% endif %}>
        <button type="submit">
            <i class="fa fa-search"></i>
        </button>
        <a href="{% url 'mkt:all' %}"><i class="fa fa-undo"></i></a>
    </form>
</div>
{% if ad_list %}
    <ul>
        {% for ad in ad_list %}
            <li>
                <a href="{% url 'mkt:ad_detail' ad.id %}" >{{ad.title}}</a>
                {% if ad.owner == user %}
                    (<a href="{% url 'mkt:ad_update' ad.id %}">Update</a>|<a href="{% url 'mkt:ad_delete' ad.id %}">Delete</a>)
                {% endif %}
                <dj4e-favstar
                    onclick="favToggle(this, '{% url 'mkt:ad_toggle' ad.id %}');"
                    {% if ad.id in favorites %} fav {% endif %}
                >
                </dj4e-favstar>
            </li>
        {% endfor %}
    </ul>
{% else %}
    <p> There are no ads in the database.</p>
{% endif %}
<script>
    function favToggle(element, url) {
        fetch(url, {method: 'POST', body:{}})
         .then((response)=>{
            if(!response.ok)
                throw new Error(`AJAX/fetch error status: ${response.status}`);
         return response.text();
         })
         .then((response)=>{
            element.toggleAttribute('fav');
         }
        ).catch((error)=> alert(`Url ${url} failed ${error}`));
    }
</script>
<script type="module" src="/site/wc/dj4e-favstar.js"></script>
{% endblock %}
