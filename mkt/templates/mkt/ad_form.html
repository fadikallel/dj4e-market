{% extends "base_menu.html" %}
{% load crispy_forms_tags %}
{% block content %}
<p>
    <form method="POST" action="" id="upload_form" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form | crispy }}
        <input type="submit" class="btn btn-primary" value="Submit">
        <input type="submit" class="btn btn-secondary" value="Cancel" onclick="window.location='{% url 'mkt:all' %}'; return false;">
    </form>
</p>
<script>
    document.getElementById('upload_form').addEventListener('submit', (event)=>{
        console.log('Checking file size');
        if(window.File && window.FileReader && window.FileList && window.Blob){
            var file = document.getElementById("id_{{form.upload_field_name}}").files[0];
            if(file && file.size > {{form.max_upload_limit}}) {
                event.preventDefault();
                alert(`File ${file.name} of type ${file.type} must be < {{form.max_upload_limit_text}}`);
                return false; 
            }
        }
    })
</script>
{% endblock %}
